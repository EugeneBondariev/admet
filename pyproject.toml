[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "admet"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
addopts = "-q -m 'not e2e'"
markers = [
    "e2e: end-to-end tests requiring a browser",
    "real_data: tests requiring downloaded data files",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
exclude = ["notebooks/"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["notebooks/"]

[tool.black]
line-length = 100
