[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "admet"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
addopts = "-q -m 'not e2e'"
filterwarnings = [
    "ignore::DeprecationWarning:torch_geometric",
]
markers = [
    "e2e: end-to-end tests requiring a browser",
    "real_data: tests requiring downloaded data files",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Top-level exclude, not lint.exclude: the latter only silences rules, it does
# not stop ruff discovering the files, so `ruff check .` still flagged notebooks.
exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["notebooks/"]

[[tool.mypy.overrides]]
module = "rdkit.*"
ignore_errors = true

[tool.black]
line-length = 100
